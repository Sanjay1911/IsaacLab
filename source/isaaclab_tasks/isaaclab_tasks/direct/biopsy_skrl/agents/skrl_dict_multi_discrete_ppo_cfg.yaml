models:
  separate: True
  policy:
    class: CategoricalMixin
    unnormalized_log_prob: True
    network:
      - name: net
        input: 'concatenate([OBSERVATIONS["current_action"], OBSERVATIONS["normalized_depth_t"], OBSERVATIONS["normalized_depth_t_ndt"], OBSERVATIONS["deviation_t"], OBSERVATIONS["deviation_t_ndt"], OBSERVATIONS["signed_delta_x"], OBSERVATIONS["signed_delta_z"], OBSERVATIONS["heading_x"], OBSERVATIONS["heading_y"], OBSERVATIONS["heading_z"]])'
        layers: [128, 64, OUTPUT]
        activations: [elu, elu, null]
    output: ACTIONS

  value:
    class: DeterministicMixin
    network:
      - name: net
        input: 'concatenate([OBSERVATIONS["current_action"], OBSERVATIONS["normalized_depth_t"], OBSERVATIONS["normalized_depth_t_ndt"], OBSERVATIONS["deviation_t"], OBSERVATIONS["deviation_t_ndt"], OBSERVATIONS["signed_delta_x"], OBSERVATIONS["signed_delta_z"], OBSERVATIONS["heading_x"], OBSERVATIONS["heading_y"], OBSERVATIONS["heading_z"]])'
        layers: [256, 128, 1]
        activations: [elu, elu, null]
    output: ONE

memory:
  class: RandomMemory
  memory_size: 16

agent:
  class: PPO
  rollouts: 16
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs:
    size: auto
    device: auto
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs:
    size: 1
    device: auto
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  mixed_precision: False
  experiment:
    directory: Isaac-Biopsy-Direct-Dict-MultiDiscrete-v1-Agent-Ludwig
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 320000
  environment_info: log
